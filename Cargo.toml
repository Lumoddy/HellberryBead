[package]
name = "hellberry-bead"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hellberry-bead"
test = false
bench = false

[dependencies]
nb = "1.1.0"
embedded-hal = "1.0"
bitflags = "2.13.2"
ufmt = "0.2.0"
nodyn = "0.2.2"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-uno"]

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
